<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقويم ميلادي وأم القرى</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <h1 class="title">التقويم الميلادي وتقويم أم القرى</h1>
    <div class="view-switch" role="group" aria-label="نوع العرض">
      <button type="button" id="view-gregorian" class="btn-view active" aria-pressed="true">ميلادي مع أم القرى</button>
      <button type="button" id="view-hijri" class="btn-view" aria-pressed="false">أم القرى مع ميلادي</button>
    </div>
    <div class="year-control">
      <label for="year-select" class="year-label" id="year-label">السنة</label>
      <input type="number" id="year-select" min="1900" max="2100" value="" aria-label="السنة">
      <button type="button" id="year-prev" class="btn-icon" aria-label="السنة السابقة">‹</button>
      <button type="button" id="year-next" class="btn-icon" aria-label="السنة التالية">›</button>
    </div>
    <a href="#current-month" id="go-to-current-month" class="btn-current-month">الشهر الحالي</a>
  </header>

  <main class="calendar-wrapper">
    <div id="calendar-grid" class="calendar-grid"></div>
  </main>

  <footer class="site-footer">
    <a
      class="github-link"
      href="https://github.com/sherif-hfm/calendar"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
      </svg>
      <span>Source code</span>
    </a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
